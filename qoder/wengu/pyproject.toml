[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wengu"
version = "0.1.0"
description = "温故 WenGu — 文献混合检索与越用越懂的复习教练（seekdb + PowerContext）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "numpy>=1.26",
    "powercontext[server]>=1.4.1,<2",
]

[project.optional-dependencies]
# Linux x86_64 / macOS arm64: embedded seekdb (pylibseekdb wheel)
seekdb = ["pyseekdb>=1.4.0"]
# 本地 ONNX 向量模型（bge-small-zh-v1.5），无需任何云 API
onnx = ["onnxruntime>=1.19", "tokenizers>=0.15"]
dev = ["pytest>=8"]

[project.scripts]
wengu = "wengu.cli:main"

[tool.setuptools.packages.find]
include = ["wengu*"]

[tool.setuptools.package-data]
wengu = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
