[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-context"
version = "1.0.0"
description = "Spec-driven engineering context for the PowerContext MiniMax track"
requires-python = ">=3.11"
dependencies = [
    "powercontext[server]>=1.2.0,<2",
]

[project.optional-dependencies]
seekdb = ["powercontext[seekdb]>=1.2.0,<2"]
test = ["pytest>=8"]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[tool.setuptools]
packages = ["sdd_context"]
