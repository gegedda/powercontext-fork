name: wengu-verify

# 可选：在没有 Linux 机器时，用 GitHub Actions 复现 Wengu 的 seekdb 验证。
# 触发方式：手工 Run workflow，或在包含 qoder/wengu 的分支上 push。
on:
  workflow_dispatch:
  push:
    paths:
      - "qoder/wengu/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (embedded seekdb)
        working-directory: qoder/wengu
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[seekdb]" pytest

      - name: Download local embedding model (optional, falls back to hash vectors)
        working-directory: qoder/wengu
        run: |
          mkdir -p data/models/bge-small-zh-v1.5
          cd data/models/bge-small-zh-v1.5
          for f in onnx/model_quantized.onnx tokenizer.json config.json; do
            curl -fsSL -o "$(basename "$f")" "https://hf-mirror.com/Xenova/bge-small-zh-v1.5/resolve/main/$f" || true
          done

      - name: Run verification
        working-directory: qoder/wengu
        env:
          WENGU_DATA_DIR: /home/runner/wengu-data
          WENGU_STORE: seekdb
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m wengu.cli doctor
          python -m wengu.cli demo --out records

      - name: Assert seekdb + memory reuse
        working-directory: qoder/wengu
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          summary = json.loads(pathlib.Path("records/demo_summary.json").read_text(encoding="utf-8"))
          restart = next(step for step in summary["steps"] if step["step"] == "restart_and_reuse")
          assert summary["store"] == "seekdb", summary["store"]
          assert restart["state_reused"] is True, restart
          assert restart["topics_after"] >= 6, restart
          tech = json.loads(pathlib.Path("records/tech.json").read_text(encoding="utf-8"))
          kinds = {event["kind"] for event in tech["events"]}
          assert "powercontext.replace_artifact" in kinds, kinds
          print("seekdb + PowerContext OK")
          PY

      - name: Upload records
        uses: actions/upload-artifact@v4
        with:
          name: wengu-records
          path: qoder/wengu/records
          retention-days: 14
